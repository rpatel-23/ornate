<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- How Ornate answers a message. A plain image (not a Mermaid block) so it shows on GitHub even when scripts are blocked.
       Colors read on both GitHub's light and dark pages: dark filled boxes, white text, gray arrows. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <g stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M150 160 H186"/>                       <!-- message -> prompt -->
    <path d="M370 160 H406"/>                       <!-- prompt -> model -->
    <path d="M540 160 H730"/>                       <!-- model -> final answer -->
    <path d="M475 115 V55 H576"/>                   <!-- model -> harness (tool call) -->
    <path d="M700 85 C700 125 640 130 530 135"/>    <!-- harness -> model (loop) -->
  </g>
  <g font-size="13" fill="#8b949e" font-weight="500">
    <text x="486" y="47">tool call</text>
    <text x="600" y="152" text-anchor="middle">no tool call</text>
    <text x="712" y="112">up to 5 rounds</text>
  </g>
  <!-- your message -->
  <rect x="10" y="135" width="140" height="50" rx="25" fill="#24292f" stroke="#57606a" stroke-width="1.5"/>
  <text x="80" y="165" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="600">Your message</text>
  <!-- system prompt -->
  <rect x="190" y="128" width="180" height="64" rx="10" fill="#24292f" stroke="#57606a" stroke-width="1.5"/>
  <text x="280" y="155" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="600">System prompt</text>
  <text x="280" y="176" text-anchor="middle" font-size="12" fill="#c9d1d9">date, tools, skills, memory</text>
  <!-- model -->
  <path d="M475 115 L540 160 L475 205 L410 160 Z" fill="#2f6fed"/>
  <text x="475" y="165" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="700">Model</text>
  <!-- harness -->
  <rect x="580" y="25" width="240" height="60" rx="10" fill="#24292f" stroke="#57606a" stroke-width="1.5"/>
  <text x="700" y="51" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="600">Harness runs the tool</text>
  <text x="700" y="71" text-anchor="middle" font-size="12" fill="#c9d1d9">and adds the result</text>
  <!-- final answer -->
  <rect x="734" y="135" width="150" height="50" rx="25" fill="#24292f" stroke="#57606a" stroke-width="1.5"/>
  <text x="809" y="165" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="600">Final answer</text>
</svg>
